# CI —— 接入指南 §9.1 的四項必做:測試+lint → build image → Trivy 掃描 → push GHCR
#
# 🔴 紅線提醒:
# - 有 high / critical CVE **即失敗**,不是印出來當參考
# - 只在版本 tag 推 image;`latest` 是紅線,且「一個 git tag 對一個 image tag,不可重發同版」
# - 正式部署是改 compose 的 image tag 後 pull,**不是**在正式機 git pull && docker build

name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/upload-program
  PYTHON_VERSION: "3.12"

concurrency:
  # 同一分支只跑最新一次,避免連續 push 時排隊浪費
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- 測試與 lint
  test:
    name: 測試 / lint / 文件同步
    # 2026-07-31:改跑 VM 上的 self-hosted runner——GitHub 免費額度用罄(v0.1.2
    # 發版中斷事件),自架 runner 不計分鐘數。🔴 這不牴觸「正式機不 build 部署」:
    # image 仍推 GHCR、部署仍是改 tag 後 pull;變的只是建置在哪台機器發生。
    # 若日後額度恢復想切回雲端,改回 ubuntu-latest 即可。
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      # 2026-07-30:self-hosted 上 setup-python 會嘗試下載整套工具鏈進 tool cache,
      # 在 VM 上掙扎 3 分半後失敗(run #81 實測)。自架環境直接用系統 Python 建
      # venv——不下載、不依賴 tool cache;切回雲端 runner 時再換回 setup-python。
      - name: 準備 Python venv(用 VM 系統 Python)
        run: |
          set -e
          PY=$(command -v python3.12 || command -v python3)
          echo "使用:$($PY --version)($PY)"
          $PY -m venv .ci-venv || {
            echo "::error::venv 建立失敗——VM 可能缺 python3-venv 套件(sudo apt install python3.12-venv)"
            exit 1
          }
          .ci-venv/bin/pip install --upgrade pip
          .ci-venv/bin/pip install -r requirements-dev.txt

      - name: Lint(ruff)
        run: .ci-venv/bin/ruff check .

      - name: 測試(pytest)
        run: .ci-venv/bin/pytest -q

      # 憲法第四條:正式文件 md 與 HTML 必須同步。靠人記得跑產生器遲早會漂移,交給 CI 擋。
      - name: 文件 md/HTML 同步檢查
        run: .ci-venv/bin/python tools/render_docs.py --check

      # 🔴 平台鐵則 8:secret 絕不進 git。這裡只做最基本的把關,不取代 secret scanning。
      - name: 檢查不該進 git 的檔案
        run: |
          set -e
          if git ls-files | grep -qE '(^|/)\.env$|\.sql$|\.xlsx$|(^|/)\.venv/|\.pyc$'; then
            echo "::error::偵測到不應進 git 的檔案(.env / *.sql / *.xlsx / .venv / *.pyc)"
            git ls-files | grep -E '(^|/)\.env$|\.sql$|\.xlsx$|(^|/)\.venv/|\.pyc$'
            exit 1
          fi
          echo "✅ 無違規檔案"

      # SSO 契約 §7 冒煙清單最後一項:repo grep 零 Authentik、零 HS256
      - name: 檢查 SSO 紅線(零 Authentik、零 HS256)
        run: |
          set -e
          # 🐛 --exclude 是**具名例外**:test_sso_contract.py 的守門測試本身必須寫出
          # 這個被禁止的字(它就是負責掃它的測試)。T51 加入該測試時漏掉這個排除,
          # CI 從那個 commit 起被自己的守門員絆倒——字串掃描器抓到守門員的第四例。
          # pytest 那側早就只掃 app/(不掃 tests/,理由相同);tests/ 其餘檔案仍在掃描範圍。
          if grep -rniE 'authentik' --include='*.py' --include='*.yml' --include='*.yaml' \
               --exclude='test_sso_contract.py' app/ tests/ 2>/dev/null; then
            echo "::error::出現 Authentik —— 身分一律走 Keycloak"
            exit 1
          fi
          # 測試檔會刻意產生 HS256 token 來驗「必須拒絕」,那是正確用法,只擋 app/ 底下的簽發
          if grep -rn 'HS256' app/ 2>/dev/null | grep -v '不接受\|一律拒\|禁'; then
            echo "::error::app/ 出現 HS256 —— JWT 必須 RS256"
            exit 1
          fi
          echo "✅ 零 Authentik、app/ 無 HS256"

  # ---------------------------------------------------------------- 建置與掃描
  build:
    name: Build image + Trivy 掃描
    runs-on: [self-hosted, Linux, X64]   # 同上:VM self-hosted(額度事件)
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 2026-07-30 run #82/#83 實測:docker-container driver 的 buildkit 是獨立容器,
      # 不吃 dockerd 的 registry mirror(本 VM 連不到 docker.io,靠 mirror.gcr.io),
      # 抓 base image 直接 i/o timeout。改用 dockerd 內建 builder——吃鏡像設定,
      # 且同機重跑天然有本機層快取(GHA 快取後端在本 VM 也連不到,一併移除)。
      # 🔴 `--pull` 是 T93 加的,不是排版:runner 是**同一台 VM**,本機層快取長期存在,
      # 沒有 `--pull` 的話 `FROM python:3.12-slim` 會一直用**第一次拉下來的那份**。
      # 2026-08-24 的 Trivy 紅燈(util-linux CVE-2026-53612~53615)就是這樣來的
      # ——上一次 main 綠是 08-11,期間 Debian 公布了那四支,而我們的 base image 沒更新。
      # 🔴 修法**不能**是 Dockerfile 加 `apt-get upgrade`:VM 連不到 apt 套件庫
      # (2026-07-30 run #85 就是為此把 builder 的 apt 整段拿掉);base image 則走
      # dockerd 的 registry mirror,那條路是通的。
      - name: Build image(dockerd 內建 builder,先只建到本機)
        run: docker build --pull -t upload-program:ci .

      # T93 診斷(**暫時步驟**,問題定調後移除):Trivy 2026-08-24 因 base image 的
      # util-linux CVE-2026-53612~53615 紅燈,而 Debian 已有修版(2.41.5-0+deb13u1)。
      # 要知道該往哪修,必須先分清三件事,所以這裡取事實而不是猜:
      #   ①base image 建立時間 → 是「上游還沒重建」還是「鏡像給了舊 manifest」
      #   ②image 內 util-linux 實際版本 → 對照 Trivy 的 Installed Version
      #   ③apt 套件庫可達性 → Dockerfile 檔頭那句「apt 不可達」是 2026-07-30 的紀錄,
      #     不能只憑一則舊註解就放棄「升級 OS 套件」這整條修法
      # 🔴 全部 `|| true`:診斷不得改變 CI 的成敗判斷。
      - name: 診斷:base image 與 apt 可達性(T93,不擋 CI)
        run: |
          set +e
          echo "### T93 診斷" >> "$GITHUB_STEP_SUMMARY"
          CREATED=$(docker image inspect python:3.12-slim --format '{{.Created}}' 2>/dev/null)
          DIGEST=$(docker image inspect python:3.12-slim --format '{{index .RepoDigests 0}}' 2>/dev/null)
          echo "base image created: ${CREATED}"
          echo "base image digest : ${DIGEST}"
          echo "- base created: ${CREATED}" >> "$GITHUB_STEP_SUMMARY"
          echo "- base digest : ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          VER=$(docker run --rm python:3.12-slim sh -c 'dpkg-query -W -f=${Version} util-linux' 2>/dev/null)
          echo "util-linux in base: ${VER}(Debian 修版為 2.41.5-0+deb13u1)"
          echo "- util-linux: ${VER}" >> "$GITHUB_STEP_SUMMARY"
          APT=$(docker run --rm python:3.12-slim sh -c 'timeout 45 apt-get update >/dev/null 2>&1 && echo APT_OK || echo APT_UNREACHABLE' 2>/dev/null)
          echo "apt 套件庫:${APT}"
          echo "- apt: ${APT}" >> "$GITHUB_STEP_SUMMARY"
          true

      - name: 檢查 image 大小(目標 ≤300 MB)
        run: |
          BYTES=$(docker image inspect upload-program:ci --format '{{.Size}}')
          MB=$((BYTES / 1024 / 1024))
          echo "image 大小:${MB} MB"
          echo "### image 大小:${MB} MB" >> "$GITHUB_STEP_SUMMARY"
          # 超標不擋 CI,但要在 PR 上看得到 —— 規約是「超過要在 PR 說明」
          if [ "$MB" -gt 300 ]; then
            echo "::warning::image ${MB} MB 超過 300 MB 目標,需在 PR 說明理由"
          fi

      - name: 檢查以 non-root 啟動
        run: |
          set -e
          USER_ID=$(docker image inspect upload-program:ci --format '{{.Config.User}}')
          echo "Config.User = '${USER_ID}'"
          if [ -z "$USER_ID" ] || [ "$USER_ID" = "root" ] || [ "$USER_ID" = "0" ]; then
            echo "::error::容器以 root 啟動 —— 違反平台鐵則 1"
            exit 1
          fi
          RUNTIME_UID=$(docker run --rm --entrypoint id upload-program:ci -u)
          echo "執行期 UID = ${RUNTIME_UID}"
          [ "$RUNTIME_UID" = "1000" ] || { echo "::error::UID 不是 1000"; exit 1; }

      # /health 是 liveness,不查相依 —— 所以不接 DB / MinIO 也必須回 200
      - name: 冒煙測試 /health(不接任何相依)
        run: |
          set -e
          docker run -d --name smoke -p 18080:8080 \
            -e PUBLIC_BASE_URL=https://catsapp.example.test \
            -e API_PREFIX=/upload \
            -e DATABASE_URL=postgresql+asyncpg://u:p@db:5432/upload_db \
            -e OIDC_ISSUER=https://auth.example.test/realms/test \
            -e OIDC_CLIENT_ID=ci -e OIDC_CLIENT_SECRET=ci \
            -e SESSION_SECRET=ci-only-not-a-real-secret \
            -e S3_ENDPOINT_URL=http://minio:9000 -e S3_BUCKET=b \
            -e S3_ACCESS_KEY=a -e S3_SECRET_KEY=b \
            upload-program:ci
          # 規約:啟動到 /health 回 200 不得超過 60 秒
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1; then
              echo "✅ /health 在第 ${i} 秒回 200(未接 DB/MinIO)"
              break
            fi
            [ "$i" = "60" ] && { echo "::error::/health 60 秒內未就緒"; docker logs smoke; exit 1; }
            sleep 1
          done
          # /ready 相反:相依不通就該回 503
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ready)
          echo "/ready = ${CODE}(無相依時應為 503)"
          [ "$CODE" = "503" ] || { echo "::error::/ready 在相依不通時未回 503"; exit 1; }
          # SIGTERM 要能優雅關閉
          docker stop -t 35 smoke
          docker rm smoke

      # 🔴 有 high / critical 即失敗
      # 2026-07-30 run #86:trivy-action 的 install.sh 從 GitHub Releases 資產域
      # (objects.githubusercontent.com)下載 binary,該域在 VM 白名單外(exit 28)。
      # 改用官方容器版:image 走 dockerd 的 registry mirror 拉(與 base image 同路),
      # 弱點 DB 從 ghcr 抓(VM 部署時拉過 GHCR image,該路已證實可達)。
      - name: Trivy 掃描(容器版)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.70.0 image \
            --format table --exit-code 1 \
            --severity HIGH,CRITICAL --ignore-unfixed \
            upload-program:ci

  # ---------------------------------------------------------------- 發布
  publish:
    name: Push GHCR(僅版本 tag)
    runs-on: [self-hosted, Linux, X64]   # 同上:VM self-hosted(額度事件)
    needs: build
    # 🔴 只有 v* tag 才推;不推 latest、不在每次 push 都發版
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登入 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 「不可重新發布同一版本」—— 已存在就直接失敗,不覆蓋
      - name: 確認此版本尚未發布過
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          if docker manifest inspect "${IMAGE_NAME}:${TAG}" >/dev/null 2>&1; then
            echo "::error::${IMAGE_NAME}:${TAG} 已存在 —— 同一版本不得重新發布,請改用新版號"
            exit 1
          fi
          echo "✅ ${TAG} 尚未發布"

      # 同 build job 的理由:dockerd 內建 builder(吃 registry mirror);只推明確版號,絕不推 latest
      - name: Build & push
        run: |
          set -e
          docker build -t "${IMAGE_NAME}:${GITHUB_REF_NAME}" .
          docker push "${IMAGE_NAME}:${GITHUB_REF_NAME}"

      - name: 發布摘要
        run: |
          {
            echo "### 已發布 \`${IMAGE_NAME}:${GITHUB_REF_NAME}\`"
            echo ""
            echo "部署方式:改 production compose 的 image tag 後 \`docker compose pull && up -d\`,"
            echo "接著 **必須** \`docker exec portal-gateway nginx -s reload\`,否則 502。"
          } >> "$GITHUB_STEP_SUMMARY"
