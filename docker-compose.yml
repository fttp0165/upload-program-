# Cats 平台部署拓撲(接入指南 §4)
#
# 🔴 只有「對外容器」(svc)上 cats-edge;db 與 minio 只在 backend,不對主機發布 port。
# 🔴 external: true 一定要配 name: cats-edge —— 少了 name,compose 會推導出
#    <專案名>_cats-edge 這張不存在的網,gateway 反代不到。
# ✅ 路徑前綴由 portal 裁決函(2026-07-29)定案為 `/upload/`,container 名對應
#    `upload-program`(portal 施工單 §3 的硬性約束)。DB 名依平台規約命名表
#    (`<service>_db`/`<service>_user`)為 `upload_program_db`/`upload_program_user`。

services:
  svc:
    container_name: upload-program   # 🔴 portal 施工單(2026-07-29)§3 的三項硬性約束之一:
    # gateway 以此名解析上游(`proxy_pass http://upload-program:8080/`);
    # 不符合就是 502,而且 `docker ps` 會顯示 healthy——只有真使用者才會撞到。
    # 下面 cats-edge 的 `aliases` 已達到同等的 DNS 解析效果,這裡補上
    # `container_name` 是求字面與施工單完全一致,不留模糊空間給下一個接手的人猜。
    image: ghcr.io/fttp0165/upload-program:v0.1.1   # SemVer,禁 latest;正式機只 pull 不 build
    env_file: .env
    # 🐛 首次上線實測(2026-07-29)發現的兩件部署形態必需品:
    # 1) cats-edge 內 `catsapp.sporton.com.tw` 別名掛在 keycloak(只聽 8080)上,
    #    容器對它打 443 必然 Connection refused。extra_hosts 蓋掉這筆解析,
    #    hairpin 回宿主機(host 443 發布給 portal-gateway)。
    #    已回饋 portal 建議把別名改掛 gateway,屆時本設定可移除。
    # 2) gateway 的 TLS 是內部 CA(catsRootCA)簽的,容器內的 httpx 需要信任它,
    #    否則 OIDC discovery 一律 CERTIFICATE_VERIFY_FAILED。
    #    CA 檔路徑以 VM 實際位置為準(目前 /home/deploy/cats-ca/)。
    extra_hosts:
      - "catsapp.sporton.com.tw:host-gateway"
    volumes:
      - /home/deploy/cats-ca/catsRootCA.crt:/etc/ssl/cats-ca.crt:ro
    environment:
      SSL_CERT_FILE: /etc/ssl/cats-ca.crt
    networks:
      frontend: {}
      backend: {}
      cats-edge:
        aliases: [upload-program]   # 必須與 gateway 設定的 proxy_pass 短名一致
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  db:
    # 🔴 主版 15 是平台規約:「全平台統一 PG15」(portal 施工單 §3,T54 核對時漏抓,
    # 2026-07-29 補正)。小版鎖定是本專案自己的慣例(可重現建置);
    # 升級小版照 runbook 的換版流程走。尚未上線,從 16.4 降主版不涉及任何資料遷移。
    image: postgres:15.8
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME 必填(.env)}
      POSTGRES_USER: ${DB_USER:?DB_USER 必填(.env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必填(.env)}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]              # 不發布 port,不上 cats-edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY 必填(.env)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY 必填(.env)}
    volumes: [minio-data:/data]      # 上傳的程式檔活在 named volume,不在容器層
    networks: [backend]              # 🔴 瀏覽器不直連物件儲存:上傳/下載都經 svc 串流
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  frontend: {}
  backend: {}
  cats-edge:
    external: true
    name: cats-edge                  # 🔴 external 必須配 name

volumes:
  pgdata: {}
  minio-data: {}
