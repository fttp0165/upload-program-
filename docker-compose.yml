# Cats 平台部署拓撲(接入指南 §4)
#
# 🔴 只有「對外容器」(svc)上 cats-edge;db 與 minio 只在 backend,不對主機發布 port。
# 🔴 external: true 一定要配 name: cats-edge —— 少了 name,compose 會推導出
#    <專案名>_cats-edge 這張不存在的網,gateway 反代不到。
# 🔴 «NAME» / «PREFIX» / GHCR namespace / DB 名皆由平台方分配,不得自選;
#    下方 upload-program / upload_db 為暫定值,拿到分配後全檔一起改。

services:
  svc:
    image: ghcr.io/fttp0165/upload-program:v0.1.0   # SemVer,禁 latest;正式機只 pull 不 build
    env_file: .env
    networks:
      frontend: {}
      backend: {}
      cats-edge:
        aliases: [upload-program]   # 必須與 gateway 設定的 proxy_pass 短名一致
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }
    restart: unless-stopped

  db:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME 必填(.env)}
      POSTGRES_USER: ${DB_USER:?DB_USER 必填(.env)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 必填(.env)}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]              # 不發布 port,不上 cats-edge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY 必填(.env)}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY 必填(.env)}
    volumes: [minio-data:/data]      # 上傳的程式檔活在 named volume,不在容器層
    networks: [backend]              # 🔴 瀏覽器不直連物件儲存:上傳/下載都經 svc 串流
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  frontend: {}
  backend: {}
  cats-edge:
    external: true
    name: cats-edge                  # 🔴 external 必須配 name

volumes:
  pgdata: {}
  minio-data: {}
