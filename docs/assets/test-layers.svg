<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410"
     font-family="'PingFang TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif">
  <rect width="900" height="410" fill="#ffffff"/>

  <!-- 冒煙(VM) -->
  <rect x="220" y="30" width="360" height="72" rx="10" fill="#eaf6ef" stroke="#2f9e5b" stroke-width="2.5"/>
  <text x="400" y="60" font-size="16" font-weight="bold" fill="#1f6b3f" text-anchor="middle">換版冒煙(VM)</text>
  <text x="400" y="84" font-size="12.5" fill="#6b7280" text-anchor="middle">四組檢查,全對才算換版完成(§9)</text>
  <line x1="580" y1="66" x2="730" y2="66" stroke="#c3c9dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="738" y="70" font-size="13" fill="#6b7280">每次換版・人工</text>

  <!-- CI 守門 -->
  <rect x="140" y="122" width="520" height="72" rx="10" fill="#eef1fb" stroke="#12228f" stroke-width="2.5"/>
  <text x="400" y="152" font-size="16" font-weight="bold" fill="#12228f" text-anchor="middle">CI 守門</text>
  <text x="400" y="176" font-size="12.5" fill="#6b7280" text-anchor="middle">pytest・ruff・文件同步・紅線掃描・Trivy</text>
  <line x1="660" y1="158" x2="730" y2="158" stroke="#c3c9dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="738" y="162" font-size="13" fill="#6b7280">每次 push / PR</text>

  <!-- 整合測試(主體) -->
  <rect x="80" y="214" width="640" height="72" rx="10" fill="#eef1fb" stroke="#12228f" stroke-width="3"/>
  <rect x="646" y="206" width="64" height="24" rx="12" fill="#2f9e5b"/>
  <text x="678" y="223" font-size="12.5" font-weight="bold" fill="#ffffff" text-anchor="middle">主體</text>
  <text x="400" y="244" font-size="16" font-weight="bold" fill="#12228f" text-anchor="middle">整合測試(約九成)</text>
  <text x="400" y="268" font-size="12.5" fill="#6b7280" text-anchor="middle">httpx 打完整 app;SQLite + 替身,不需 Docker / PG / MinIO / Keycloak</text>
  <line x1="720" y1="250" x2="730" y2="250" stroke="#c3c9dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="738" y="254" font-size="13" fill="#6b7280">開發中隨時</text>

  <!-- 純函式 -->
  <rect x="180" y="306" width="440" height="72" rx="10" fill="#f7f8fc" stroke="#9aa3c0" stroke-width="2"/>
  <text x="400" y="336" font-size="16" font-weight="bold" fill="#334" text-anchor="middle">純函式測試</text>
  <text x="400" y="360" font-size="12.5" fill="#6b7280" text-anchor="middle">markdown_lite・dashboard・oidc 錯誤解析…</text>
  <line x1="620" y1="342" x2="730" y2="342" stroke="#c3c9dd" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="738" y="346" font-size="13" fill="#6b7280">開發中隨時</text>
</svg>
