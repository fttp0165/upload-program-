<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"
     font-family="'PingFang TC','Microsoft JhengHei','WenQuanYi Zen Hei',sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="34" y="38" font-size="14" font-weight="bold" fill="#12228f">使用者旅程(依序測)</text>

  <!-- 旅程七格 -->
  <rect x="34" y="54" width="112" height="86" rx="9" fill="#eef1fb" stroke="#12228f" stroke-width="2"/>
  <text x="90" y="88" font-size="13" font-weight="bold" fill="#12228f" text-anchor="middle">登入・SSO</text>
  <text x="90" y="118" font-size="12" fill="#6b7280" text-anchor="middle">13 項</text>

  <rect x="154" y="54" width="112" height="86" rx="9" fill="#eef1fb" stroke="#12228f" stroke-width="2"/>
  <text x="210" y="88" font-size="13" font-weight="bold" fill="#12228f" text-anchor="middle">帳號開通</text>
  <text x="210" y="118" font-size="12" fill="#6b7280" text-anchor="middle">7 項</text>

  <rect x="274" y="54" width="112" height="86" rx="9" fill="#eef1fb" stroke="#12228f" stroke-width="2"/>
  <text x="330" y="88" font-size="13" font-weight="bold" fill="#12228f" text-anchor="middle">專案</text>
  <text x="330" y="118" font-size="12" fill="#6b7280" text-anchor="middle">10 項</text>

  <rect x="394" y="54" width="112" height="86" rx="9" fill="#eef1fb" stroke="#12228f" stroke-width="2"/>
  <text x="450" y="88" font-size="13" font-weight="bold" fill="#12228f" text-anchor="middle">版本發布</text>
  <text x="450" y="118" font-size="12" fill="#6b7280" text-anchor="middle">8 項</text>

  <rect x="514" y="54" width="112" height="86" rx="9" fill="#eaf6ef" stroke="#2f9e5b" stroke-width="2.5"/>
  <text x="570" y="88" font-size="13" font-weight="bold" fill="#1f6b3f" text-anchor="middle">上傳</text>
  <text x="570" y="118" font-size="12" fill="#6b7280" text-anchor="middle">10 項・人工重點</text>

  <rect x="634" y="54" width="112" height="86" rx="9" fill="#eef1fb" stroke="#12228f" stroke-width="2"/>
  <text x="690" y="88" font-size="13" font-weight="bold" fill="#12228f" text-anchor="middle">下載</text>
  <text x="690" y="118" font-size="12" fill="#6b7280" text-anchor="middle">6 項</text>

  <rect x="754" y="54" width="112" height="86" rx="9" fill="#eaf6ef" stroke="#2f9e5b" stroke-width="2.5"/>
  <text x="810" y="88" font-size="13" font-weight="bold" fill="#1f6b3f" text-anchor="middle">問題回報</text>
  <text x="810" y="118" font-size="12" fill="#6b7280" text-anchor="middle">13 項・人工重點</text>

  <!-- 旅程箭頭 -->
  <polygon points="152,97 146,92 146,102" fill="#334"/>
  <polygon points="272,97 266,92 266,102" fill="#334"/>
  <polygon points="392,97 386,92 386,102" fill="#334"/>
  <polygon points="512,97 506,92 506,102" fill="#334"/>
  <polygon points="632,97 626,92 626,102" fill="#334"/>
  <polygon points="752,97 746,92 746,102" fill="#334"/>

  <text x="34" y="182" font-size="14" font-weight="bold" fill="#12228f">跨切面(每次都在)</text>

  <rect x="34" y="196" width="196" height="64" rx="9" fill="#f7f8fc" stroke="#9aa3c0" stroke-width="2"/>
  <text x="132" y="222" font-size="13" font-weight="bold" fill="#334" text-anchor="middle">管理後台</text>
  <text x="132" y="244" font-size="12" fill="#6b7280" text-anchor="middle">8 項</text>

  <rect x="246" y="196" width="196" height="64" rx="9" fill="#fdf0ef" stroke="#b3372f" stroke-width="2"/>
  <text x="344" y="222" font-size="13" font-weight="bold" fill="#b3372f" text-anchor="middle">安全跨切面</text>
  <text x="344" y="244" font-size="12" fill="#6b7280" text-anchor="middle">9 項</text>

  <rect x="458" y="196" width="196" height="64" rx="9" fill="#f7f8fc" stroke="#9aa3c0" stroke-width="2"/>
  <text x="556" y="222" font-size="13" font-weight="bold" fill="#334" text-anchor="middle">部署與維運</text>
  <text x="556" y="244" font-size="12" fill="#6b7280" text-anchor="middle">7 項(多為人工)</text>

  <rect x="670" y="196" width="196" height="64" rx="9" fill="#f7f8fc" stroke="#9aa3c0" stroke-width="2"/>
  <text x="768" y="222" font-size="13" font-weight="bold" fill="#334" text-anchor="middle">介面</text>
  <text x="768" y="244" font-size="12" fill="#6b7280" text-anchor="middle">6 項</text>

  <!-- 圖例 -->
  <rect x="34" y="282" width="832" height="34" rx="8" fill="#eef1fb"/>
  <text x="450" y="304" font-size="12.5" fill="#334" text-anchor="middle">✅ 自動:CI 每次跑,人工只抽查 ・ 🖐 人工:測試工程師的主力 ・ ✓ 冒煙:每次換版必跑(15–20 分鐘)</text>
</svg>
