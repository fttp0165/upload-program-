# 僅作為 lint / test 設定;相依仍以 requirements*.txt 為準。

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = [
  "B008",  # FastAPI 的 Depends()/Query() 就是寫在預設值
  "E501",  # 行長交給 formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]  # 測試裡的 assert 與假密碼是刻意的
"alembic/*" = ["E402"]

[tool.pytest.ini_options]
# 🐛 根本原因(T12,CI 第一次執行抓到):`python -m pytest` 會把 cwd 加進 sys.path,
# 但 `pytest` 執行檔不會 —— 於是本機跑得過、CI 一跑就 ModuleNotFoundError: No module named 'app'。
# 明確宣告 pythonpath,兩種呼叫方式都能用,不必要求開發者記得用哪一種。
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
